version: "3.8"
services:
  postgres:
    image: postgres:15-alpine
    container_name: asyncfl-postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asyncfl_user"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
